<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<title>Edzésterv – 4 nap, 5–9 fókusz, 3 munkasorozat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A;
    --card:#1C1F26;
    --card-hover:#20242D;
    --line:#2A2E37;
    --ink:#F2F1ED;
    --ink-muted:#8B8F98;
    --ink-faint:#5C616B;

    --push:#FF6B4A;
    --pull:#4AA8FF;
    --leg:#4ADE80;
    --upper:#B98BFA;

    /* Egységes napi színtéma – a korábbi pénteki smaragdzöld dizájn */
    --monday:#5FA078;
    --tuesday:#5FA078;
    --thursday:#5FA078;
    --friday:#5FA078;

    --collection:#A86F2A;
    --progress:#5E82C6;

    --radius:16px;
    --radius-sm:10px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }

  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* ---------- Top bar ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    background:rgba(20,22,26,0.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding-top:env(safe-area-inset-top);
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); padding:14px 18px 2px;
    font-family:'JetBrains Mono',monospace;
  }
  .tabs{
    display:flex; gap:6px; padding:6px 12px 12px;
  }
  .tab{
    flex:1; text-align:center; padding:10px 4px 9px;
    border-radius:12px; border:1px solid transparent;
    background:transparent; color:var(--ink-muted);
    font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:13px; letter-spacing:.03em;
    cursor:pointer; transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .tab .dot{
    display:block; width:5px; height:5px; border-radius:50%;
    background:var(--ink-faint); margin:0 auto 5px;
    transition:background .15s ease, box-shadow .15s ease;
  }
  .tab.active{
    background:linear-gradient(180deg,
      color-mix(in srgb,var(--accent) 13%,var(--card)),
      color-mix(in srgb,var(--accent) 5%,var(--card))
    );
    border-color:color-mix(in srgb,var(--accent) 72%,var(--line));
    color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.025),
               0 4px 14px color-mix(in srgb,var(--accent) 8%,transparent);
  }
  .tab.active .dot{
    background:var(--accent);
    box-shadow:0 0 7px color-mix(in srgb,var(--accent) 55%,transparent);
  }
  .tab[data-key="monday"] .dot{ background:color-mix(in srgb,var(--monday) 68%,var(--ink-faint)); }
  .tab[data-key="tuesday"] .dot{ background:color-mix(in srgb,var(--tuesday) 68%,var(--ink-faint)); }
  .tab[data-key="thursday"] .dot{ background:color-mix(in srgb,var(--thursday) 68%,var(--ink-faint)); }
  .tab[data-key="friday"] .dot{ background:color-mix(in srgb,var(--friday) 68%,var(--ink-faint)); }
  .tab.active .dot{ background:var(--accent); }

  /* ---------- Day section ---------- */
  main{ max-width:560px; margin:0 auto; padding:18px 14px 0; }
  .day-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:4px 4px 14px; gap:10px;
  }
  .day-head h1{
    margin:0; font-size:26px; line-height:1.05;
    display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
  }
  .day-head h1 .tag{
    font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    color:var(--accent); letter-spacing:.02em;
    font-family:'Inter',sans-serif;
  }

  /* ---------- Exercise card ---------- */
  .exercise{
    background:var(--card);
    border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    border-left:4px solid var(--accent);
    border-radius:var(--radius); margin-bottom:13px; overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.14);
  }

  .exercise-row{
    display:flex; align-items:stretch; min-width:0;
  }
  .exercise-row .ex-head{
    width:auto; flex:1; min-width:0;
  }
  .drag-handle,
  .exercise-state-btn{
    flex:0 0 38px; width:38px; min-height:56px;
    border:0; color:var(--ink-muted);
    background:color-mix(in srgb, var(--accent) 8%, var(--card));
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace;
    transition:background .15s ease,color .15s ease,opacity .15s ease;
  }
  .drag-handle{
    border-right:1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
    cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
    font-size:22px; line-height:1; letter-spacing:-3px; padding-right:3px;
  }
  .drag-handle:active{ cursor:grabbing; }
  .exercise-state-btn{
    border-left:1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
    flex-direction:column; gap:1px; font-weight:700;
  }
  .exercise-state-btn .state-icon{ font-size:16px; line-height:1; }
  .exercise-state-btn .state-text{ font-size:9px; letter-spacing:.05em; }
  .drag-handle:active,
  .exercise-state-btn:active{
    background:color-mix(in srgb, var(--accent) 20%, var(--card));
    color:var(--accent);
  }
  .exercise.dragging{
    opacity:.96; transform:scale(1.01);
    box-shadow:0 14px 34px rgba(0,0,0,.42);
    z-index:1000;
  }
  .exercise.drag-placeholder{
    border:2px dashed color-mix(in srgb, var(--accent) 72%, var(--line));
    border-left-width:4px;
    background:color-mix(in srgb, var(--accent) 8%, transparent);
    box-shadow:none;
    opacity:.8;
  }
  .exercise.drag-placeholder.inactive{
    border-color:var(--ink-faint);
    background:color-mix(in srgb, var(--ink-faint) 8%, transparent);
  }
  body.exercise-drag-active{
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  .exercise.inactive{
    border-color:var(--line); border-left-color:var(--ink-faint);
    box-shadow:none;
  }
  .exercise.inactive .ex-head,
  .exercise.inactive .drag-handle,
  .exercise.inactive .exercise-state-btn{
    background:color-mix(in srgb, var(--ink-faint) 8%, var(--card));
  }
  .exercise.inactive .ex-name,
  .exercise.inactive .ex-focus,
  .exercise.inactive .ex-sets,
  .exercise.inactive .chevron,
  .exercise.inactive .drag-handle{
    opacity:.5;
  }
  .exercise.inactive .exercise-state-btn{
    color:var(--upper);
  }
  .exercise.inactive .ex-sets{
    color:var(--ink-muted); border-color:var(--line); background:transparent;
  }
  .exercise.inactive .chevron{
    border-color:var(--line); background:var(--card-hover);
  }
  .exercise.inactive .chevron::after{ border-color:var(--ink-muted); }
  @media (max-width:430px){
    .drag-handle,.exercise-state-btn{ flex-basis:34px; width:34px; }
    .ex-head{ padding-left:10px; padding-right:8px; gap:7px; }
    .ex-name{ font-size:14px; }
    .ex-focus{ font-size:9.5px; }
    .ex-sets{ font-size:12px; padding:4px 5px; }
  }

  .ex-head{
    width:100%; display:flex; align-items:center; gap:10px;
    background:color-mix(in srgb, var(--accent) 11%, var(--card));
    border:none; border-bottom:1px solid transparent; color:var(--ink);
    padding:14px 12px 14px 14px; text-align:left; cursor:pointer; font:inherit;
    transition:background .15s ease, border-color .15s ease;
  }
  .ex-head:active{ background:color-mix(in srgb, var(--accent) 20%, var(--card)); }
  .exercise.open .ex-head{
    background:color-mix(in srgb, var(--accent) 17%, var(--card));
    border-bottom-color:color-mix(in srgb, var(--accent) 30%, var(--line));
  }
  .ex-title{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .ex-name{ font-size:15px; font-weight:600; line-height:1.3; }
  .ex-focus{
    color:color-mix(in srgb,var(--accent) 72%,var(--ink-muted));
    font-size:10.5px; font-weight:600; line-height:1.35;
  }
  .ex-sets{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;
    color:var(--accent); white-space:nowrap;
    background:color-mix(in srgb, var(--accent) 13%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    border-radius:8px; padding:4px 7px;
  }
  .chevron{
    width:28px; height:28px; border-radius:9px;
    background:color-mix(in srgb, var(--accent) 18%, var(--card-hover));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    position:relative; margin-left:2px; flex-shrink:0;
  }
  .chevron::after{
    content:""; position:absolute; left:9px; top:7px; width:7px; height:7px;
    border-right:2px solid var(--accent); border-bottom:2px solid var(--accent);
    transform:rotate(45deg); transition:transform .2s ease, top .2s ease;
  }
  .exercise.open .chevron::after{ transform:rotate(-135deg); top:11px; }

  .ex-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
  }
  .ex-body-inner{ padding:0 14px 16px; }

  .frames{ display:flex; gap:8px; margin-bottom:12px; }
  .frame{ flex:1; min-width:0; }
  .frame img{
    width:100%; height:auto; display:block; border-radius:var(--radius-sm);
    background:var(--line); aspect-ratio:1/1; object-fit:cover;
  }
  .frame.image-missing{
    min-height:0;
  }
  .frame.image-missing .image-fallback{
    width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    padding:12px; border-radius:var(--radius-sm); background:var(--line); color:var(--ink-faint);
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1.4;
  }

  .frame span{
    display:block; text-align:center; font-size:10px; color:var(--ink-faint);
    margin-top:5px; font-family:'JetBrains Mono',monospace; letter-spacing:.04em; text-transform:uppercase;
  }

  .approx-note{
    font-size:11.5px; color:var(--ink-faint); margin:-4px 0 12px; line-height:1.4;
  }

  /* célizmok */
  .frame.muscle-frame img{
    background:#f4f3ef; object-fit:contain; padding:8px;
  }
  .frame.contain-frame img{
    background:#f4f3ef; object-fit:contain; padding:6px;
  }
  .image-credit{
    font-size:10.5px; color:var(--ink-faint); margin:-4px 0 12px; line-height:1.45;
  }
  .image-credit a{ color:var(--ink-muted); }
  .muscle-note{
    font-size:12.5px; color:var(--ink-muted); line-height:1.5; margin:-4px 0 12px;
  }
  .muscle-note b{ color:var(--ink); font-weight:600; }
  .muscle-note .m-secondary{ color:var(--ink-faint); }
  .muscle-note-row + .muscle-note-row{ margin-top:4px; }
  .muscle-note-label{ color:var(--ink); font-weight:600; }

  /* Részletes útmutató */
  .guide-box{
    background:rgba(255,255,255,0.04);
    border-left:3px solid var(--accent);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    margin:0 0 12px;
    font-size:12.5px;
    line-height:1.6;
    color:var(--ink-muted);
  }
  .guide-box strong{ color:var(--ink); font-weight:600; }
  .guide-box .step{ display:block; margin-top:8px; padding-left:12px; position:relative; }
  .guide-box .step::before{ content:"•"; position:absolute; left:0; color:var(--accent); }
  .guide-box .step b{ color:var(--ink); font-weight:600; }

  .tip-note{
    font-size:12px; color:var(--ink-muted); line-height:1.5;
    background:var(--card-hover); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 11px; margin:0 0 12px;
  }
  .tip-note b{ color:var(--accent); font-weight:600; }

  .performance-log{
    margin:10px 0 12px; padding:12px;
    background:rgba(255,255,255,0.035); border:1px solid var(--line);
    border-radius:var(--radius-sm);
  }
  .performance-grid{
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;
  }
  .performance-set{
    min-width:0; padding:9px 7px 8px;
    background:color-mix(in srgb, var(--accent) 7%, var(--bg));
    border:1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
    border-radius:10px;
  }
  .performance-set-title{
    margin:0 0 8px; text-align:center; color:var(--accent);
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    letter-spacing:.035em; text-transform:uppercase;
  }
  .performance-field{ min-width:0; }
  .performance-field + .performance-field{ margin-top:8px; }
  .performance-field label{
    display:block; margin:0 0 5px; color:var(--ink-muted); font-size:12px; font-weight:600;
    line-height:1.25; text-align:center;
  }
  .performance-field input{
    width:100%; min-width:0; padding:9px 4px; background:var(--bg); border:1px solid var(--line);
    border-radius:9px; color:var(--ink); text-align:center; font-family:'JetBrains Mono',monospace;
    font-size:16px; font-weight:600;
  }
  .performance-field input:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 17%, transparent);
  }
  .performance-field input.modified-this-week{
    background:color-mix(in srgb, var(--accent) 18%, var(--card-hover));
    border-color:color-mix(in srgb, var(--accent) 72%, var(--line));
    box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent),
               0 0 14px color-mix(in srgb, var(--accent) 13%, transparent);
  }
  .performance-field input.modified-this-week:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent),
               0 0 16px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .performance-field input::placeholder{ color:var(--ink-faint); font-size:10px; font-weight:400; }
  .performance-note{ margin-top:8px; color:var(--ink-faint); font-size:10.5px; line-height:1.45; }
  @media (max-width:350px){
    .performance-log{ padding:10px 8px; }
    .performance-grid{ gap:5px; }
    .performance-set{ padding:8px 4px 7px; }
    .performance-field input{ padding-left:2px; padding-right:2px; }
  }


  /* ---------- Edzésfázisok: jól elkülönített blokkok ---------- */
  .phase-panel{
    position:relative;
    margin:0 0 30px;
    padding:14px 12px 12px;
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
  }
  .phase-panel + .phase-panel{ margin-top:30px; }
  .phase-panel::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  }
  .warmup-panel{
    background:linear-gradient(180deg,rgba(255,183,77,.075),rgba(255,255,255,.018));
    border-color:rgba(255,183,77,.24);
  }
  .workout-panel{
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,transparent),rgba(255,255,255,.018));
    border-color:color-mix(in srgb,var(--accent) 34%,var(--line));
    padding-bottom:4px;
  }
  .cooldown-panel{
    background:linear-gradient(180deg,rgba(74,168,255,.07),rgba(255,255,255,.018));
    border-color:rgba(74,168,255,.23);
  }
  .phase-ribbon{
    display:flex;
    align-items:center;
    gap:9px;
    margin:-2px 1px 14px;
    color:var(--ink-muted);
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.11em;
  }
  .phase-ribbon span{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:24px;
    border-radius:8px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);
    color:var(--ink);
    font-weight:700;
    letter-spacing:.02em;
  }
  .phase-ribbon strong{ font-weight:700; color:var(--ink); }
  .warmup-panel .phase-ribbon strong{ color:#FFD08A; }
  .workout-panel .phase-ribbon strong{ color:var(--accent); }
  .cooldown-panel .phase-ribbon strong{ color:#8DC7FF; }

  .training-block-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin:0 2px 8px;
  }
  .training-block-head h2{
    margin:0;
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    line-height:1.15;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.02em;
  }
  .training-block-head.counterless-head{ justify-content:flex-end; }
  .training-intro{
    margin:0 2px 14px;
    color:var(--ink-muted);
    font-size:11.5px;
    line-height:1.5;
  }
  .workout-panel .ex-list{ margin-top:4px; }
  .workout-panel .exercise:last-child{ margin-bottom:8px; }


  footer{
    max-width:560px; margin:22px auto 0; padding:14px 18px 6px;
    font-size:11.5px; color:var(--ink-faint); line-height:1.6; border-top:1px solid var(--line);
  }
  footer a{ color:var(--ink-muted); }
  .backup-actions{
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;
  }
  .backup-btn{
    min-height:46px; border-radius:12px;
    border:1px solid color-mix(in srgb,var(--upper) 48%,var(--line));
    background:color-mix(in srgb,var(--upper) 12%,var(--card));
    color:var(--ink); font-family:'Space Grotesk',sans-serif;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .backup-btn:active{
    background:color-mix(in srgb,var(--upper) 25%,var(--card-hover));
    transform:translateY(1px);
  }
  .footer-add-btn{
    border-color:color-mix(in srgb,var(--friday) 58%,var(--line));
    background:color-mix(in srgb,var(--friday) 15%,var(--card));
    color:var(--friday); font-size:25px; line-height:1;
  }
  .footer-add-btn:active{
    background:color-mix(in srgb,var(--friday) 27%,var(--card-hover));
  }
  .footer-add-btn:disabled{
    opacity:.34; cursor:not-allowed; transform:none;
    border-color:var(--line); background:var(--card); color:var(--ink-faint);
  }
  @media (max-width:430px){
    .backup-actions{ gap:6px; }
    .backup-btn{ min-height:44px; padding:6px 3px; font-size:11px; }
    .footer-add-btn{ font-size:24px; }
  }
  .collection-footer-btn{
    border-color:color-mix(in srgb,var(--collection) 50%,var(--line));
    background:color-mix(in srgb,var(--collection) 10%,var(--card));
    color:#d8c0a2;
  }
  .collection-footer-btn:active,
  .collection-footer-btn.active{
    border-color:var(--collection);
    background:color-mix(in srgb,var(--collection) 20%,var(--card-hover));
    color:#f0dfc9;
  }
  .backup-file-input{ display:none; }
  .backup-status{
    min-height:18px; margin-top:8px; text-align:center;
    font-size:11px; color:var(--ink-muted);
  }

  .export-modal[hidden]{ display:none; }
  .export-modal{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    padding:18px; background:rgba(8,10,14,.72);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .export-dialog{
    width:min(100%,420px);
    background:var(--card); border:1px solid color-mix(in srgb,var(--upper) 45%,var(--line));
    border-radius:18px; padding:18px;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .export-dialog h2{
    margin:0 0 8px; color:var(--ink);
    font-family:'Space Grotesk',sans-serif; font-size:20px; line-height:1.2;
  }
  .export-dialog p{
    margin:0 0 14px; color:var(--ink-muted); font-size:12.5px; line-height:1.5;
  }
  .export-name-label{
    display:block; margin-bottom:7px; color:var(--ink);
    font-size:13px; font-weight:700;
  }
  .export-name-input{
    width:100%; min-height:48px; padding:10px 12px;
    border:1px solid var(--line); border-radius:12px;
    background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:16px;
  }
  .export-name-input:focus{ outline:none; border-color:var(--upper); }
  .export-dialog-actions{

// -------------------- KÖZPONTI GYŰJTEMÉNY --------------------
const DAY_CONFIGS = DATA.map(day => ({
  key: day.key,
  label: day.label,
  accent: day.accent
}));

function normalizedExerciseName(name){
  return String(name || '').trim().toLocaleLowerCase('hu-HU');
}

const COLLECTION = [];
const COLLECTION_BY_ID = new Map();
const EXERCISE_ALIAS_TO_CANONICAL = new Map();
const collectionByName = new Map();

DATA.forEach(day => {
  day.exercises.forEach(exercise => {
    const nameKey = normalizedExerciseName(exercise.n);
    let canonical = collectionByName.get(nameKey);
    if(!canonical){
      canonical = {
        ...exercise,
        legacySources: []
      };
      collectionByName.set(nameKey, canonical);
      COLLECTION.push(canonical);
      COLLECTION_BY_ID.set(canonical.uid, canonical);
    }
    canonical.legacySources.push({dayKey:day.key, uid:exercise.uid});
    EXERCISE_ALIAS_TO_CANONICAL.set(exercise.uid, canonical.uid);
  });
});

COLLECTION_ONLY_EXERCISES.forEach(exercise => {
  const nameKey = normalizedExerciseName(exercise.n);
  let canonical = collectionByName.get(nameKey);
  if(!canonical){
    canonical = {
      ...exercise,
      legacySources: []
    };
    collectionByName.set(nameKey, canonical);
    COLLECTION.push(canonical);
    COLLECTION_BY_ID.set(canonical.uid, canonical);
  }
  EXERCISE_ALIAS_TO_CANONICAL.set(exercise.uid, canonical.uid);
});

  let values = [];
  try{
    const parsed = JSON.parse(localStorage.getItem(dayPlanKey(dayKey)) || '[]');
    if(Array.isArray(parsed)) values = parsed;
  }catch(_error){ values = []; }
  const result = [];
  values.forEach(id => {
    const canonical = canonicalExerciseId(id);
    if(COLLECTION_BY_ID.has(canonical) && !result.includes(canonical)) result.push(canonical);
  });
  return result;
}

function saveDayPlan(dayKey, ids){
  const clean = [];
  ids.forEach(id => {
    const canonical = canonicalExerciseId(id);
    if(COLLECTION_BY_ID.has(canonical) && !clean.includes(canonical)) clean.push(canonical);
  });
  localStorage.setItem(dayPlanKey(dayKey), JSON.stringify(clean));
}

function localDateId(date){
  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,'0');
  const day = String(date.getDate()).padStart(2,'0');
  return `${year}-${month}-${day}`;
}
function currentHighlightWeekId(now = new Date()){
  const sunday = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  sunday.setDate(sunday.getDate()-sunday.getDay());
  return localDateId(sunday);
}
function clearWeeklyFieldHighlights(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key && key.startsWith(FIELD_HIGHLIGHT_PREFIX)) keys.push(key);
  }
  keys.forEach(key=>localStorage.removeItem(key));
  document.querySelectorAll('.modified-this-week').forEach(input=>input.classList.remove('modified-this-week'));
}
function ensureCurrentHighlightWeek(){
  const current=currentHighlightWeekId();
  if(localStorage.getItem(FIELD_HIGHLIGHT_WEEK_KEY)!==current){
    clearWeeklyFieldHighlights();
    localStorage.setItem(FIELD_HIGHLIGHT_WEEK_KEY,current);
  }
}
function scheduleNextWeeklyHighlightReset(){
  if(weeklyHighlightResetTimer) clearTimeout(weeklyHighlightResetTimer);
  const now=new Date();
  let days=(7-now.getDay())%7;
  if(days===0) days=7;
  const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+days,0,0,1,0);
  weeklyHighlightResetTimer=setTimeout(()=>{
    ensureCurrentHighlightWeek();
    applyAllStoredInputs();
    scheduleNextWeeklyHighlightReset();
  },Math.max(1000,next.getTime()-now.getTime()));
}

function migrateLegacyValues(){
  COLLECTION.forEach(exercise=>{
    const nSets=3;
    for(let setIdx=0;setIdx<nSets;setIdx++){
      const canonicalWeight=setWeightKey(exercise.uid,setIdx);
      const canonicalReps=setRepsKey(exercise.uid,setIdx);
      for(const source of exercise.legacySources){
        const sourceWeight=setWeightKey(source.uid,setIdx);
        const sourceReps=setRepsKey(source.uid,setIdx);
        if(localStorage.getItem(canonicalWeight)===null){
          const value=localStorage.getItem(sourceWeight);
          if(value!==null && value!=='') localStorage.setItem(canonicalWeight,value);
        }
        if(localStorage.getItem(canonicalReps)===null){
          const value=localStorage.getItem(sourceReps);
          if(value!==null && value!=='') localStorage.setItem(canonicalReps,value);
        }
        if(localStorage.getItem(fieldHighlightKey(sourceWeight))==='1') localStorage.setItem(fieldHighlightKey(canonicalWeight),'1');
        if(localStorage.getItem(fieldHighlightKey(sourceReps))==='1') localStorage.setItem(fieldHighlightKey(canonicalReps),'1');
      }
    }
  });
}

function migrateOldBackupPlans(){
  if(DAY_CONFIGS.some(day=>localStorage.getItem(dayPlanKey(day.key))!==null)) return;
  DAY_CONFIGS.forEach(day=>{
    const sourceDay=DATA.find(item=>item.key===day.key);
    if(!sourceDay) return;
    const known=sourceDay.exercises.map(ex=>ex.uid);
    let order=[];
    try{
      const parsed=JSON.parse(localStorage.getItem(`exercise_order_v1_${day.key}`)||'[]');
      if(Array.isArray(parsed)) order=parsed.filter(id=>known.includes(id));
    }catch(_error){ order=[]; }
    order=[...order,...known.filter(id=>!order.includes(id))];
    const active=order.filter(id=>localStorage.getItem(`exercise_active_v1_${id}`)!=='0');
    const canonical=[];
    active.forEach(id=>{
      const value=canonicalExerciseId(id);
      if(COLLECTION_BY_ID.has(value) && !canonical.includes(value)) canonical.push(value);
    });
    saveDayPlan(day.key,canonical);
  });
}

function scrollBlockBelowHeader(block,delay=0){

    const header=document.querySelector('header.top');
    const headerHeight=header?header.getBoundingClientRect().height:0;
    const target=window.scrollY+block.getBoundingClientRect().top-headerHeight-8;

function markImageUnavailable(img){
  if(!img || img.dataset.imageFailed==='1') return;
  img.dataset.imageFailed='1';
  const frame=img.closest('.frame');
  if(!frame) return;
  frame.classList.add('image-missing');
  img.style.display='none';
  if(!frame.querySelector('.image-fallback')){
    const fallback=document.createElement('div');
    fallback.className='image-fallback';
    fallback.textContent='Kép betöltése sikertelen';
    frame.insertBefore(fallback,frame.firstChild);
  }
}

function loadCardImages(container){
  container.querySelectorAll('img[data-src]').forEach(img=>{
    const primary=img.dataset.src;
    let fallbacks=[];
    try{
      fallbacks=JSON.parse(decodeURIComponent(img.dataset.fallbacks||'%5B%5D'));
    }catch(_error){
      fallbacks=[];
    }
    const queue=[primary,...fallbacks].filter(Boolean);
    let index=0;

    const tryNext=()=>{
      if(index>=queue.length){
        console.warn('Kép betöltése sikertelen:', img.alt, queue);
        markImageUnavailable(img);
        return;
      }
      const next=queue[index++];
      img.src=next;
    };

    img.addEventListener('error',tryNext);
    img.addEventListener('load',()=>{
      img.dataset.imageLoaded='1';
      const frame=img.closest('.frame');
      if(frame){
        frame.classList.remove('image-missing');
        frame.querySelector('.image-fallback')?.remove();
      }
      img.style.display='';
    });
    tryNext();
    img.removeAttribute('data-src');
  });
}

// -------------------- FEJLŐDÉSI NAPLÓ --------------------
function progressHistoryKey(exId){ return `${PROGRESS_HISTORY_PREFIX}${canonicalExerciseId(exId)}`; }
function progressPendingKey(exId){ return `${PROGRESS_PENDING_PREFIX}${canonicalExerciseId(exId)}`; }
function parseProgressNumber(value){
  if(value===null||value===undefined||String(value).trim()==='') return null;
  const number=Number(String(value).replace(',','.'));
  return Number.isFinite(number)&&number>=0?number:null;
}
function sanitizeProgressSets(sets){
  return Array.from({length:3},(_,index)=>{
    const source=Array.isArray(sets)?sets[index]||{}:{};
    return {weight:parseProgressNumber(source.weight),reps:parseProgressNumber(source.reps)};
  });
}
function hasCompleteProgressSet(sets){
  return sanitizeProgressSets(sets).some(set=>set.weight!==null&&set.weight>0&&set.reps!==null&&set.reps>0);
}
function getProgressHistory(exId){
  try{
    const parsed=JSON.parse(localStorage.getItem(progressHistoryKey(exId))||'[]');
    if(!Array.isArray(parsed)) return [];
    const byDate=new Map();
    parsed.forEach(item=>{
      if(!item||typeof item.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(item.date)) return;
      byDate.set(item.date,{
        date:item.date,
        dayKey:DAY_CONFIGS.some(day=>day.key===item.dayKey)?item.dayKey:'',
        timestamp:typeof item.timestamp==='string'?item.timestamp:`${item.date}T12:00:00`,
        sets:sanitizeProgressSets(item.sets)
      });
    });
    return [...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
  }catch(_error){ return []; }
}
function saveProgressHistory(exId,history){
  const clean=[...history].sort((a,b)=>a.date.localeCompare(b.date));
  if(clean.length) localStorage.setItem(progressHistoryKey(exId),JSON.stringify(clean));
  else localStorage.removeItem(progressHistoryKey(exId));
}
function getProgressPending(exId){
  try{
    const value=JSON.parse(localStorage.getItem(progressPendingKey(exId))||'null');
    if(!value||typeof value.date!=='string'||!Number.isFinite(Number(value.dueAt))) return null;
    return {...value,exerciseId:canonicalExerciseId(exId),sets:sanitizeProgressSets(value.sets),pending:true};
  }catch(_error){ return null; }
}
function readCurrentProgressSets(exId){
  return Array.from({length:3},(_,setIdx)=>(
    {weight:parseProgressNumber(localStorage.getItem(setWeightKey(exId,setIdx))),
     reps:parseProgressNumber(localStorage.getItem(setRepsKey(exId,setIdx)))}
  ));
}
function upsertProgressEntry(exId,pending){
  if(!COLLECTION_BY_ID.has(canonicalExerciseId(exId))||!hasCompleteProgressSet(pending.sets)) return;
  const history=getProgressHistory(exId);
  const entry={
    date:pending.date,
    dayKey:pending.dayKey,
    timestamp:new Date().toISOString(),
    sets:sanitizeProgressSets(pending.sets)
  };
  const index=history.findIndex(item=>item.date===entry.date);
  if(index>=0) history[index]=entry; else history.push(entry);
  saveProgressHistory(exId,history);
}
function scheduleProgressTimer(exId){
  const canonical=canonicalExerciseId(exId);
  if(progressTimers.has(canonical)) clearTimeout(progressTimers.get(canonical));
  const pending=getProgressPending(canonical);
  if(!pending) return;
  const wait=Math.max(0,Number(pending.dueAt)-Date.now());
  const timer=setTimeout(()=>finalizeProgressPending(canonical),Math.min(wait,2147483000));
  progressTimers.set(canonical,timer);
}
function finalizeProgressPending(exId){
  const canonical=canonicalExerciseId(exId);
  const pending=getProgressPending(canonical);
  if(!pending){ progressTimers.delete(canonical); return; }
  if(Number(pending.dueAt)>Date.now()+250){ scheduleProgressTimer(canonical); return; }
  upsertProgressEntry(canonical,pending);
  localStorage.removeItem(progressPendingKey(canonical));
  if(progressTimers.has(canonical)) clearTimeout(progressTimers.get(canonical));
  progressTimers.delete(canonical);
  renderProgress();
}
function scheduleProgressCapture(exId,dayKey){
  const canonical=canonicalExerciseId(exId);
  if(!COLLECTION_BY_ID.has(canonical)) return;
  const now=new Date();
  const pending={
    exerciseId:canonical,
    date:localDateId(now),
    dayKey,
    updatedAt:now.toISOString(),
    dueAt:Date.now()+PROGRESS_DELAY_MS,
    sets:readCurrentProgressSets(canonical)
  };
  localStorage.setItem(progressPendingKey(canonical),JSON.stringify(pending));
  scheduleProgressTimer(canonical);
  renderProgress();
}
function processAllProgressPending(){
  COLLECTION.forEach(exercise=>{
    const pending=getProgressPending(exercise.uid);
    if(!pending) return;
    if(Number(pending.dueAt)<=Date.now()) finalizeProgressPending(exercise.uid);
    else scheduleProgressTimer(exercise.uid);
  });
}
function cleanupOrphanProgressData(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(!key) continue;
    let exId='';
    if(key.startsWith(PROGRESS_HISTORY_PREFIX)) exId=key.slice(PROGRESS_HISTORY_PREFIX.length);
    else if(key.startsWith(PROGRESS_PENDING_PREFIX)) exId=key.slice(PROGRESS_PENDING_PREFIX.length);
    if(exId&&(!COLLECTION_BY_ID.has(canonicalExerciseId(exId))||canonicalExerciseId(exId)!==exId)) keys.push(key);
  }
  keys.forEach(key=>localStorage.removeItem(key));
}
function formatProgressNumber(value){
  if(value===null||value===undefined||!Number.isFinite(Number(value))) return '–';
  return new Intl.NumberFormat('hu-HU',{maximumFractionDigits:2}).format(Number(value));
}
function formatProgressDate(dateId,short=false){
  const date=new Date(`${dateId}T12:00:00`);
  if(Number.isNaN(date.getTime())) return dateId;
  return new Intl.DateTimeFormat('hu-HU',short?{month:'short',day:'numeric'}:{year:'numeric',month:'long',day:'numeric'}).format(date);
}
function progressDayLabel(dayKey){ return DAY_CONFIGS.find(day=>day.key===dayKey)?.label||''; }
function progressSetSummary(sets){
  return sanitizeProgressSets(sets).map(set=>`${formatProgressNumber(set.weight)} kg × ${formatProgressNumber(set.reps)}`).join(' · ');
}
function progressVolume(sets){
  return sanitizeProgressSets(sets).reduce((sum,set)=>sum+((set.weight||0)*(set.reps||0)),0);
}
function progressTotalReps(sets){
  return sanitizeProgressSets(sets).reduce((sum,set)=>sum+(set.reps||0),0);
}
function progressBestSet(sets){
  return sanitizeProgressSets(sets).filter(set=>set.weight!==null&&set.reps!==null&&set.weight>0&&set.reps>0)
    .sort((a,b)=>b.weight-a.weight||b.reps-a.reps)[0]||null;
}
function progressRepColor(reps){
  const value=Math.round(Number(reps)||0);
  if(value<=0) return '#59606b';
  if(value<=2) return '#b94b42';
  if(value<=4) return '#cf7438';
  if(value<=6) return '#d2ad3d';
  if(value===7) return '#8da94a';
  if(value===8) return '#4d9863';
  return '#2f7650';
}
function progressRepTextColor(reps){
  const value=Math.round(Number(reps)||0);
  return value>=5&&value<=7?'#191b1f':'#ffffff';
}
function progressRangeValue(){ return ['4','8','12','all'].includes(progressRange)?progressRange:'8'; }
function currentProgressCutoff(){
  const today=localDateId(new Date());
  const stored=progressDateInput?.value||localStorage.getItem(PROGRESS_CUTOFF_KEY)||today;
  return /^\d{4}-\d{2}-\d{2}$/.test(stored)&&stored<=today?stored:today;
}
function combinedProgressEntries(exId){
  const history=getProgressHistory(exId).map(entry=>({...entry,pending:false}));
  const pending=getProgressPending(exId);
  if(pending){
    const index=history.findIndex(item=>item.date===pending.date);
    if(index>=0) history[index]=pending; else history.push(pending);
  }
  return history.sort((a,b)=>a.date.localeCompare(b.date));
}
function filteredProgressEntries(exId){
  const cutoff=currentProgressCutoff();
  let entries=combinedProgressEntries(exId).filter(entry=>entry.date<=cutoff&&hasCompleteProgressSet(entry.sets));
  const range=progressRangeValue();
  if(range!=='all') entries=entries.slice(-Number(range));
  return entries;
}
function progressRecordDates(exId){
  const cutoff=currentProgressCutoff();
  const records=new Set();
  let record=-Infinity;
  combinedProgressEntries(exId).filter(entry=>entry.date<=cutoff&&hasCompleteProgressSet(entry.sets)).forEach(entry=>{
    const top=Math.max(...sanitizeProgressSets(entry.sets).map(set=>set.weight||0));
    if(top>record){ records.add(entry.date); record=top; }
  });
  return records;
}
function progressScale(values,heightTop,heightBottom){
  let min=Math.min(...values),max=Math.max(...values);
  if(!Number.isFinite(min)||!Number.isFinite(max)) return null;
  if(min===max){ min=Math.max(0,min-5); max=max+5; }
  const pad=(max-min)*.12;
  min=Math.max(0,min-pad); max=max+pad;
  return {min,max,y(value){return heightBottom-((value-min)/(max-min))*(heightBottom-heightTop);}};
}
function chartPath(points){
  return points.map((point,index)=>`${index?'L':'M'} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(' ');
}
function buildProgressChart(exercise,entries){
  if(!entries.length) return '<div class="progress-chart-empty">Még nincs rögzített eredmény ehhez a gyakorlathoz.</div>';
  const mode=['sets','volume','best'].includes(progressMode)?progressMode:'sets';
  const isAll=progressRangeValue()==='all';
  // A szettnézetben egy dátumhoz akár három külön karika tartozik.
  // Több dátumnál szélesebb, vízszintesen görgethető vászon kell, hogy a
  // szettkarikák se egymást, se a szomszédos dátum pontjait ne takarják.
  const needsScrollableSetWidth=mode==='sets'&&entries.length>4;
  const usesFixedPixelWidth=isAll||needsScrollableSetWidth;
  const width=usesFixedPixelWidth?Math.max(430,entries.length*76+70):430;
  const height=250,left=46,right=20,top=24,bottom=205;
  const innerWidth=width-left-right;
  const xAt=index=>entries.length===1?left+innerWidth/2:left+(index/(entries.length-1))*innerWidth;
  const selected=progressSelectedDates.get(exercise.uid)||'';
  const latestDate=entries[entries.length-1]?.date;
  const recordDates=progressRecordDates(exercise.uid);
  const grid=[];
  let shapes='';
  let scale=null;
  const uid=`pg-${exercise.uid.replace(/[^a-zA-Z0-9]/g,'')}-${mode}`;

  if(mode==='volume'){
    const values=entries.map(entry=>progressVolume(entry.sets));
    scale=progressScale(values,top,bottom);
    if(!scale) return '<div class="progress-chart-empty">Nincs ábrázolható volumenadat.</div>';
    const points=values.map((value,index)=>({x:xAt(index),y:scale.y(value),value,index}));
    const line=chartPath(points);
    const area=`${line} L ${points[points.length-1].x} ${bottom} L ${points[0].x} ${bottom} Z`;
    shapes+=`<defs><linearGradient id="${uid}-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7097dd" stop-opacity=".35"/><stop offset="100%" stop-color="#7097dd" stop-opacity=".02"/></linearGradient></defs>`;
    shapes+=`<path d="${area}" fill="url(#${uid}-fill)"/><path d="${line}" fill="none" stroke="#78a0e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    points.forEach(point=>{
      const entry=entries[point.index],isSelected=selected===entry.date,isLatest=latestDate===entry.date;
      const radius=isSelected?7:5.5;
      shapes+=`<g class="progress-point-group${entry.pending?' pending-point':''}" data-progress-date="${entry.date}"><circle class="progress-point" cx="${point.x}" cy="${point.y}" r="${radius}" fill="#78a0e5" stroke="${isLatest?'#f5f7ff':'#20242d'}" stroke-width="${isLatest?2.5:1.5}" ${entry.pending?'stroke-dasharray="3 2"':''}/></g>`;
    });
  }else{
    const weights=[];
    entries.forEach(entry=>sanitizeProgressSets(entry.sets).forEach(set=>{if(set.weight>0&&set.reps>0)weights.push(set.weight);}));
    scale=progressScale(weights,top,bottom);
    if(!scale) return '<div class="progress-chart-empty">Nincs ábrázolható súlyadat.</div>';
    const trend=[];
    entries.forEach((entry,index)=>{
      const best=progressBestSet(entry.sets);
      if(best) trend.push({x:xAt(index),y:scale.y(best.weight)});
    });
    if(trend.length>1) shapes+=`<path d="${chartPath(trend)}" fill="none" stroke="#7f9bd0" stroke-opacity=".46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    entries.forEach((entry,index)=>{
      const x=xAt(index),sets=sanitizeProgressSets(entry.sets).filter(set=>set.weight>0&&set.reps>0);
      const points=mode==='best'?(progressBestSet(entry.sets)?[progressBestSet(entry.sets)]:[]):sets;
      const prPointIndex=points.reduce((bestIndex,item,itemIndex,array)=>{
        if(bestIndex<0) return itemIndex;
        const best=array[bestIndex];
        return item.weight>best.weight||(item.weight===best.weight&&item.reps>best.reps)?itemIndex:bestIndex;
      },-1);
      // A normál karika sugara 9 px, kijelölve 11 px, a PR-gyűrű pedig
      // még nagyobb. A korábbi 11–14 px-es középtávolság emiatt átfedést
      // okozott. A 28 px-es középtávolság már kijelölt állapotban is
      // külön tartja a szetteket, azonos súlynál is.
      const offsets=mode==='best'?[0]:points.length===1?[0]:points.length===2?[-14,14]:[-28,0,28];
      if(mode==='sets'&&points.length>1){
        const ys=points.map(set=>scale.y(set.weight));
        shapes+=`<line x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}" stroke="#77849a" stroke-opacity=".38" stroke-width="1.4"/>`;
      }
      points.forEach((set,setIndex)=>{
        const px=x+offsets[setIndex],py=scale.y(set.weight);
        const isSelected=selected===entry.date,isLatest=latestDate===entry.date;
        const radius=isSelected?11:9;
        const isPr=recordDates.has(entry.date)&&setIndex===prPointIndex;
        if(isPr) shapes+=`<circle cx="${px}" cy="${py}" r="${radius+4}" fill="none" stroke="#f1c65a" stroke-width="1.8" stroke-opacity=".9"/>`;
        shapes+=`<g class="progress-point-group${entry.pending?' pending-point':''}" data-progress-date="${entry.date}"><circle class="progress-point" cx="${px}" cy="${py}" r="${radius}" fill="${progressRepColor(set.reps)}" stroke="${isLatest?'#f5f7ff':'#20242d'}" stroke-width="${isLatest?2.5:1.6}" ${entry.pending?'stroke-dasharray="3 2"':''}/><text x="${px}" y="${py+.5}" text-anchor="middle" dominant-baseline="middle" fill="${progressRepTextColor(set.reps)}" font-family="JetBrains Mono,monospace" font-size="${isSelected?10.5:9.5}" font-weight="700">${Math.round(set.reps)}</text></g>`;
        if(isPr) shapes+=`<text x="${px}" y="${py-radius-7}" text-anchor="middle" fill="#f1c65a" font-size="9">★</text>`;
      });
    });
  }

  for(let i=0;i<5;i++){
    const value=scale.min+(scale.max-scale.min)*(i/4);
    const y=scale.y(value);
    grid.push(`<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="#39404c" stroke-opacity=".55" stroke-width="1"/><text x="${left-7}" y="${y+3}" text-anchor="end" fill="#767d89" font-family="JetBrains Mono,monospace" font-size="9">${formatProgressNumber(value)}</text>`);
  }
  const labels=entries.map((entry,index)=>`<text x="${xAt(index)}" y="${bottom+28}" text-anchor="middle" fill="${selected===entry.date?'#e9efff':'#777e89'}" font-family="JetBrains Mono,monospace" font-size="9">${formatProgressDate(entry.date,true)}</text>`).join('');
  const axisLabel=mode==='volume'?'Volumen (kg)':'Súly (kg)';
  return `<svg class="progress-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${exercise.n} fejlődési grafikonja" style="width:${usesFixedPixelWidth?width+'px':'100%'}"><text x="${left}" y="14" fill="#8b93a0" font-family="JetBrains Mono,monospace" font-size="9">${axisLabel}</text>${grid.join('')}${shapes}${labels}</svg>`;
}
function progressLegendHtml(){
  const latest='<span class="progress-legend-item"><span class="progress-legend-dot" style="background:transparent;border:2px solid #f5f7ff"></span>legutóbbi</span>';
  if(progressMode==='volume') return `<span class="progress-legend-item">A pontok a három szett teljes volumenét mutatják.</span>${latest}`;
  const reps=[
    [1,'1–2'],[3,'3–4'],[5,'5–6'],[7,'7'],[8,'8'],[9,'9']
  ].map(([reps,label])=>`<span class="progress-legend-item"><span class="progress-legend-dot" style="background:${progressRepColor(reps)}"></span>${label}</span>`).join('');

function progressHistoryEntryHtml(exId,entry){

function progressHistoryListHtml(exId){
  const history=getProgressHistory(exId).sort((a,b)=>b.date.localeCompare(a.date));
  if(!history.length) return '<div class="progress-empty">Még nincs korábbi bejegyzés.</div>';
  const cutoff=currentProgressCutoff();
  const current=history.filter(entry=>entry.date<=cutoff);
  const future=history.filter(entry=>entry.date>cutoff);
  return `${current.map(entry=>progressHistoryEntryHtml(exId,entry)).join('')||'<div class="progress-empty">A kiválasztott dátumig nincs bejegyzés.</div>'}${future.length?`<details class="progress-future-details"><summary>Későbbi eredmények (${future.length})</summary><div class="progress-history-list">${future.map(entry=>progressHistoryEntryHtml(exId,entry)).join('')}</div></details>`:''}`;
}
function createProgressCardHtml(exercise,assignedDays){

  const entries=filteredProgressEntries(exercise.uid);

  const latest=historyUntilCutoff[historyUntilCutoff.length-1]||null;
  const selectedDate=progressSelectedDates.get(exercise.uid)||'';
  const selected=entries.find(entry=>entry.date===selectedDate)||null;

function assignedDaysByExercise(){

function renderProgress(){

  const query=String(progressSearchInput?.value||'').trim().toLocaleLowerCase('hu-HU');
  const matchesSearch=exercise=>!query||exercise.n.toLocaleLowerCase('hu-HU').includes(query);
  const allActive=[...COLLECTION].filter(exercise=>(assignments.get(exercise.uid)||[]).length).sort(compareExerciseNames);
  const allInactive=[...COLLECTION].filter(exercise=>!(assignments.get(exercise.uid)||[]).length).sort(compareExerciseNames);
  const active=allActive.filter(matchesSearch);
  const inactive=allInactive.filter(matchesSearch);

    ?active.map(exercise=>createProgressCardHtml(exercise,assignments.get(exercise.uid)||[])).join('')

-group-head" type="button"><span class="progress-group-title">Felvett gyakorlatok</span><span class="progress-group-count" data-progress-count="active">0</span><span class="progress-group-arrow"></span></button><div class="progress-group-body"><div class="progress-active-list"></div></div></div><div class="progress-group ${inactiveOpen?'open':''}" data-progress-group="inactive"><button class="progress-group-head" type="button"><span class="progress-group-title">Nem felvett gyakorlatok</span><span class="progress-group-count" data-progress-count="inactive">0</span><span class="progress-group-arrow"></span></button><div class="progress-group-body"><div class="progress-inactive-list"></div></div></div>`;

  });

    localStorage.setItem(PROGRESS_CUTOFF_KEY,progressDateInput.value); renderProgress();
  });
  section.addEventListener('click',event=>{
    const modeButton=event.target.closest('[data-progress-mode]');
    if(modeButton){ progressMode=modeButton.dataset.progressMode; localStorage.setItem(PROGRESS_MODE_KEY,progressMode); renderProgress(); return; }
    const rangeButton=event.target.closest('[data-progress-range]');
    if(rangeButton){ progressRange=rangeButton.dataset.progressRange; localStorage.setItem(PROGRESS_RANGE_KEY,progressRange); renderProgress(); return; }
    const groupHead=event.target.closest('.progress-group-head');
    if(groupHead){
      const group=groupHead.closest('.progress-group'); group.classList.toggle('open');
      const isOpen=group.classList.contains('open');
      localStorage.setItem(group.dataset.progressGroup==='active'?PROGRESS_ACTIVE_OPEN_KEY:PROGRESS_INACTIVE_OPEN_KEY,isOpen?'1':'0');
      return;
    }
    const point=event.target.closest('[data-progress-date]');

      const card=point.closest('[data-progress-ex-id]');
      if(card){ progressSelectedDates.set(card.dataset.progressExId,point.dataset.progressDate); renderProgress(); }
      return;
    }
    const historyToggle=event.target.closest('[data-history-toggle]');
    if(historyToggle){
      const exId=historyToggle.dataset.historyToggle;
      if(progressOpenHistories.has(exId)) progressOpenHistories.delete(exId); else progressOpenHistories.add(exId);
      renderProgress(); return;
    }

  });
  renderProgress();
}
function openProgressEdit(exId,date){

  });
  document.getElementById('progress-edit-error').textContent='';
  document.getElementById('progress-edit-modal').hidden=false;
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('progress-edit-weight-0')?.focus(),50);
}
function closeProgressEdit(){
  document.getElementById('progress-edit-modal').hidden=true; progressEditing=null; document.body.style.overflow='';
}
function saveProgressEdit(){
  if(!progressEditing) return;
  const sets=Array.from({length:3},(_,index)=>({
    weight:parseProgressNumber(document.getElementById(`progress-edit-weight-${index}`).value),
    reps:parseProgressNumber(document.getElementById(`progress-edit-reps-${index}`).value)
  }));
  if(!hasCompleteProgressSet(sets)){
    document.getElementById('progress-edit-error').textContent='Legalább egy szettnél add meg a súlyt és az ismétlést.'; return;
  }
  const history=getProgressHistory(progressEditing.exId);
  const index=history.findIndex(item=>item.date===progressEditing.date);
  if(index<0) return closeProgressEdit();
  history[index]={...history[index],sets:sanitizeProgressSets(sets),timestamp:new Date().toISOString()};
  saveProgressHistory(progressEditing.exId,history);
  closeProgressEdit(); renderProgress();
}
function openProgressDelete(exId,date){
  const exercise=COLLECTION_BY_ID.get(canonicalExerciseId(exId));
  if(!exercise) return;
  progressDeleting={exId:canonicalExerciseId(exId),date};
  document.getElementById('progress-delete-message').textContent=`Biztosan törlöd ezt az eredményt: ${exercise.n} · ${formatProgressDate(date)}?`;
  document.getElementById('progress-delete-modal').hidden=false; document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('progress-delete-accept')?.focus(),50);
}
function closeProgressDelete(){ document.getElementById('progress-delete-modal').hidden=true; progressDeleting=null; document.body.style.overflow=''; }
function confirmProgressDelete(){
  if(!progressDeleting) return closeProgressDelete();
  const history=getProgressHistory(progressDeleting.exId).filter(item=>item.date!==progressDeleting.date);
  saveProgressHistory(progressDeleting.exId,history);
  if(progressSelectedDates.get(progressDeleting.exId)===progressDeleting.date) progressSelectedDates.delete(progressDeleting.exId);
  closeProgressDelete(); renderProgress();
}
function initializeProgressDialogs(){
  document.getElementById('progress-edit-form')?.addEventListener('submit',event=>{event.preventDefault();saveProgressEdit();});
  document.getElementById('progress-edit-cancel')?.addEventListener('click',closeProgressEdit);
  document.getElementById('progress-edit-modal')?.addEventListener('click',event=>{if(event.target.id==='progress-edit-modal')closeProgressEdit();});
  document.getElementById('progress-delete-cancel')?.addEventListener('click',closeProgressDelete);

  document.getElementById('progress-delete-modal')?.addEventListener('click',event=>{if(event.target.id==='progress-delete-modal')closeProgressDelete();});

function renderAllDays(){ DAY_CONFIGS.forEach(day=>renderDay(day.key)); renderProgress(); }

function addExerciseToDay(dayKey,exId){
  const plan=getDayPlan(dayKey);

function removeExerciseFromDay(dayKey,exId){

}

function setupExerciseDrag(handle,card,list,dayKey){
  if(!handle||!card||!list) return;
  let dragging=false,activePointerId=null,lastY=0,grabOffsetY=0,placeholder=null,originalStyle='',scrollFrame=0,moved=false,startY=0;

  function closeBeforeDrag(){
    card.classList.remove('open');
    const body=card.querySelector('.ex-body');
    if(body) body.style.maxHeight='0';
  }
  function placePlaceholder(clientY){
    if(!placeholder) return;
    const candidates=[...list.querySelectorAll('.exercise')].filter(el=>el!==card&&el!==placeholder);
    for(const target of candidates){
      const rect=target.getBoundingClientRect();
      if(clientY<rect.top+rect.height/2){ list.insertBefore(placeholder,target); return; }
    }
    list.appendChild(placeholder);
  }
  function updateFloating(){
    const height=card.getBoundingClientRect().height;
    card.style.top=`${Math.max(4,Math.min(Math.max(4,window.innerHeight-height-4),lastY-grabOffsetY))}px`;
  }
  function moveDrag(_x,y){
    if(!dragging) return;
    lastY=y;
    if(Math.abs(lastY-startY)>4) moved=true;
    updateFloating(); placePlaceholder(y);
  }
  function autoScroll(){
    if(!dragging) return;
    let delta=0;
    if(lastY<92) delta=-11; else if(lastY>window.innerHeight-92) delta=11;
    if(delta){ window.scrollBy(0,delta); placePlaceholder(lastY); }
    scrollFrame=requestAnimationFrame(autoScroll);
  }
  function startDrag(x,y,pointerId=null){
    if(dragging) return;
    closeBeforeDrag();
    const rect=card.getBoundingClientRect();
    dragging=true; activePointerId=pointerId; lastY=y; startY=y; moved=false;
    grabOffsetY=Math.max(0,Math.min(rect.height,y-rect.top));
    originalStyle=card.getAttribute('style')||'';
    placeholder=document.createElement('div');
    placeholder.className='exercise drag-placeholder';
    placeholder.style.height=`${rect.height}px`;
    list.insertBefore(placeholder,card);
    card.classList.add('dragging'); document.body.classList.add('exercise-drag-active');
    Object.assign(card.style,{position:'fixed',left:`${rect.left}px`,top:`${rect.top}px`,width:`${rect.width}px`,margin:'0',pointerEvents:'none'});
    scrollFrame=requestAnimationFrame(autoScroll);
  }
  function finishDrag(){
    if(!dragging) return;
    dragging=false;
    if(scrollFrame) cancelAnimationFrame(scrollFrame);
    if(placeholder?.parentElement){ list.insertBefore(card,placeholder); placeholder.remove(); }
    placeholder=null; card.classList.remove('dragging'); document.body.classList.remove('exercise-drag-active');
    if(originalStyle) card.setAttribute('style',originalStyle); else card.removeAttribute('style');
    activePointerId=null; saveCurrentDomOrder(dayKey);
  }
  handle.addEventListener('pointerdown',event=>{
    if(event.pointerType==='mouse'&&event.button!==0) return;
    event.preventDefault(); startDrag(event.clientX,event.clientY,event.pointerId);
  },{passive:false});
  document.addEventListener('pointermove',event=>{
    if(!dragging||(activePointerId!==null&&event.pointerId!==activePointerId)) return;
    event.preventDefault(); moveDrag(event.clientX,event.clientY);
  },{passive:false});
  document.addEventListener('pointerup',event=>{
    if(dragging&&(activePointerId===null||event.pointerId===activePointerId)) finishDrag();
  });
  document.addEventListener('pointercancel',finishDrag);
  handle.addEventListener('touchstart',event=>{
    if(dragging) return;
    const touch=event.changedTouches?.[0]; if(!touch) return;
    event.preventDefault(); startDrag(touch.clientX,touch.clientY,'touch');
  },{passive:false});
  document.addEventListener('touchmove',event=>{
    if(!dragging) return;
    const touch=event.touches?.[0]; if(!touch) return;
    event.preventDefault(); moveDrag(touch.clientX,touch.clientY);
  },{passive:false});
  document.addEventListener('touchend',()=>{if(dragging)finishDrag();});
  document.addEventListener('touchcancel',finishDrag);
  handle.addEventListener('click',event=>{
    if(moved){ event.preventDefault(); event.stopPropagation(); moved=false; }
  });
}

function applyStoredInput(input){
  const key=performanceValueKey(input);
  input.value=key?(localStorage.getItem(key)||''):'';
  applyModifiedFieldState(input);
}
function applyStoredInputsWithin(root){
  root.querySelectorAll('.set-weight-input,.set-reps-input').forEach(applyStoredInput);
}
function applyAllStoredInputs(){ applyStoredInputsWithin(document); }

function syncMatchingInputs(source){
  const isWeight=source.classList.contains('set-weight-input');
  const className=isWeight?'set-weight-input':'set-reps-input';
  const exId=canonicalExerciseId(source.dataset.exId);
  const selector=`.${className}[data-ex-id="${CSS.escape(exId)}"][data-set-idx="${source.dataset.setIdx}"]`;
  document.querySelectorAll(selector).forEach(input=>{
    if(input!==source) input.value=source.value;
  });
}

document.addEventListener('input',event=>{
  const input=event.target.closest('.set-weight-input,.set-reps-input');
  if(!input) return;
  const key=performanceValueKey(input);
  const value=input.value.trim();
  if(value==='') localStorage.removeItem(key); else localStorage.setItem(key,value);
  syncMatchingInputs(input);
  markMatchingFieldsModified(input);
  const section=input.closest('.day-section');
  const viewKey=section?.id?.replace(/^day-/,'');
  if(DAY_CONFIGS.some(day=>day.key===viewKey)) scheduleProgressCapture(canonicalExerciseId(input.dataset.exId),viewKey);
});

function showView(viewKey){
  localStorage.setItem('selectedDay',viewKey);
  document.querySelectorAll('.day-section').forEach(section=>section.style.display=section.id===`day-${viewKey}`?'block':'none');
  document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.key===viewKey));
  document.getElementById('collection-view-btn')?.classList.toggle('active',viewKey==='collection');
  const footerAddButton=document.getElementById('footer-add-exercise-btn');
  const activeDay=DAY_CONFIGS.find(day=>day.key===viewKey);
  if(footerAddButton){
    footerAddButton.disabled=!activeDay;
    footerAddButton.title=activeDay?`${activeDay.label} – gyakorlat hozzáadása`:'A + gomb egy edzésnap megnyitásakor használható';
    footerAddButton.setAttribute('aria-label',activeDay?`${activeDay.label} naphoz gyakorlat hozzáadása`:'Gyakorlat hozzáadása – előbb válassz edzésnapot');
  }
  const activeTab=document.querySelector(`.tab[data-key="${CSS.escape(viewKey)}"]`);
  if(activeTab&&tabsEl){
    requestAnimationFrame(()=>{
      const left=activeTab.offsetLeft-(tabsEl.clientWidth-activeTab.offsetWidth)/2;
      tabsEl.scrollTo({left:Math.max(0,left),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    });
  }
  if(viewKey==='progress'){ processAllProgressPending(); renderProgress(); }
  applyAllStoredInputs();
  window.scrollTo({top:0});
}

// -------------------- EXPORT / IMPORT --------------------
const BACKUP_APP_ID='mark-edzesterv';
const BACKUP_VERSION=4;
const CURRENT_PREFIXES=['set_weight_v12_','set_reps_v12_',DAY_PLAN_PREFIX,FIELD_HIGHLIGHT_PREFIX,PROGRESS_HISTORY_PREFIX,PROGRESS_PENDING_PREFIX];
const CURRENT_EXACT_KEYS=new Set(['selectedDay',FIELD_HIGHLIGHT_WEEK_KEY,PROGRESS_MODE_KEY,PROGRESS_RANGE_KEY,PROGRESS_CUTOFF_KEY,PROGRESS_ACTIVE_OPEN_KEY,PROGRESS_INACTIVE_OPEN_KEY]);
const LEGACY_PREFIXES=['exercise_order_v1_','exercise_active_v1_','set_weight_v11_','set_reps_v10_','weight_v9_','edzes_v10_','edzes_v9_'];
function isCurrentStorageKey(key){ return CURRENT_EXACT_KEYS.has(key)||CURRENT_PREFIXES.some(prefix=>key.startsWith(prefix)); }
function isLegacyStorageKey(key){ return isCurrentStorageKey(key)||LEGACY_PREFIXES.some(prefix=>key.startsWith(prefix)); }
function getWorkoutStorageData(){
  cleanupOrphanProgressData();
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key&&isCurrentStorageKey(key)) data[key]=localStorage.getItem(key);
  }
  return data;
}
function setBackupStatus(message,isError=false){
  const status=document.getElementById('backup-status'); if(!status)return;
  status.textContent=message; status.style.color=isError?'#ff8b73':'var(--ink-muted)';
}
function defaultExportFileName(){ return `edzesterv-mentes-${new Date().toISOString().slice(0,10)}`; }
function normalizeExportFileName(value){
  let name=String(value||'').trim().replace(/\.json$/i,'').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').replace(/[. ]+$/g,'').trim();
  return name||defaultExportFileName();
}
function openExportNameDialog(){
  const modal=document.getElementById('export-modal'),input=document.getElementById('export-name-input');
  if(!modal||!input)return; input.value=defaultExportFileName(); modal.hidden=false; document.body.style.overflow='hidden';
  setTimeout(()=>{input.focus();input.select();},50);
}
function closeExportNameDialog(){ const modal=document.getElementById('export-modal');if(modal)modal.hidden=true;document.body.style.overflow=''; }
function exportWorkoutData(name){
  const fileName=`${normalizeExportFileName(name)}.json`;
  const payload={app:BACKUP_APP_ID,version:BACKUP_VERSION,exportedAt:new Date().toISOString(),data:getWorkoutStorageData()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=fileName;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  setBackupStatus(`Mentés elkészült: ${fileName}`);
}
function validateBackup(payload){
  if(!payload||typeof payload!=='object'||payload.app!==BACKUP_APP_ID||![1,2,3,4].includes(payload.version)) return false;
  if(!payload.data||typeof payload.data!=='object'||Array.isArray(payload.data)) return false;
  return Object.entries(payload.data).every(([key,value])=>isLegacyStorageKey(key)&&(typeof value==='string'||value===null));
}
function clearWorkoutStorageData(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&isLegacyStorageKey(key))keys.push(key);}
  keys.forEach(key=>localStorage.removeItem(key));
}
async function importWorkoutData(file){
  try{
    const payload=JSON.parse(await file.text());
    if(!validateBackup(payload)) throw new Error('A fájl nem ehhez az edzéstervhez tartozó, érvényes mentés.');
    if(!confirm(`A mentés ${Object.keys(payload.data).length} adatot tartalmaz. Lecseréled a jelenlegi adatokat?`)){
      setBackupStatus('Importálás megszakítva.'); return;
    }
    clearWorkoutStorageData();
    Object.entries(payload.data).forEach(([key,value])=>{if(value!==null)localStorage.setItem(key,value);});
    migrateLegacyValues();
    if(payload.version<3) migrateOldBackupPlans();
    ensureCurrentHighlightWeek();
    cleanupOrphanProgressData();
    progressMode=['sets','volume','best'].includes(localStorage.getItem(PROGRESS_MODE_KEY))?localStorage.getItem(PROGRESS_MODE_KEY):'sets';
    progressRange=['4','8','12','all'].includes(localStorage.getItem(PROGRESS_RANGE_KEY))?localStorage.getItem(PROGRESS_RANGE_KEY):'8';
    const importedToday=localDateId(new Date());
    const importedCutoff=localStorage.getItem(PROGRESS_CUTOFF_KEY);
    if(progressDateInput) progressDateInput.value=importedCutoff&&importedCutoff<=importedToday?importedCutoff:importedToday;
    progressSection?.querySelector('[data-progress-group="active"]')?.classList.toggle('open',localStorage.getItem(PROGRESS_ACTIVE_OPEN_KEY)!=='0');
    progressSection?.querySelector('[data-progress-group="inactive"]')?.classList.toggle('open',localStorage.getItem(PROGRESS_INACTIVE_OPEN_KEY)==='1');
    processAllProgressPending();
    renderAllDays();
    renderProgress();
    applyAllStoredInputs();
    const selected=localStorage.getItem('selectedDay');
    showView(ALL_VIEWS.some(view=>view.key===selected)?selected:'monday');
    setBackupStatus('Adatok visszaállítva és azonnal megjelenítve.');
  }catch(error){ setBackupStatus(error.message||'Az importálás nem sikerült.',true); }
}
